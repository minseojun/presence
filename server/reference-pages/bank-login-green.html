<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Malgun Gothic',sans-serif}
  body{background:#eef8f0}
  header{background:#0a7a3d;color:#fff;padding:14px 18px;font-weight:700;font-size:15px;letter-spacing:.05em}
  .wrap{max-width:400px;margin:40px auto;background:#fff;border-radius:14px;padding:30px 22px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
  .logo{width:60px;height:60px;background:#0a7a3d;border-radius:50%;margin:0 auto 16px}
  h1{text-align:center;font-size:19px;color:#0a7a3d;margin-bottom:22px}
  input{width:100%;padding:14px 12px;margin-bottom:11px;border:1px solid #d3e8d9;border-radius:8px;font-size:14px;background:#f7fbf8}
  button{width:100%;padding:15px;background:#0a7a3d;color:#fff;border:none;border-radius:8px;font-weight:700;font-size:15px;margin-top:8px}
  .links{display:flex;justify-content:center;gap:14px;margin-top:18px;font-size:12px;color:#4a6a55}
  .cert{text-align:center;margin-top:22px;padding-top:18px;border-top:1px solid #e3f0e6;font-size:12px;color:#4a6a55}
  footer{text-align:center;margin-top:32px;font-size:10px;color:#8fae9a}
</style></head>
<body>
<header>NH농협은행</header>
<div class="wrap">
  <div class="logo"></div>
  <h1>인터넷뱅킹 로그인</h1>
  <input placeholder="아이디 입력">
  <input type="password" placeholder="비밀번호 입력">
  <button>로그인하기</button>
  <div class="links"><span>아이디/비번찾기</span><span>회원가입</span></div>
  <div class="cert">공동인증서 &nbsp;|&nbsp; 간편로그인 &nbsp;|&nbsp; OTP</div>
</div>
<footer>NH농협은행 인터넷뱅킹</footer>
</body></html>
