<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Malgun Gothic',sans-serif}
  body{background:#f3f6fb}
  header{background:#0b3d91;color:#fff;padding:14px 18px;font-weight:700;font-size:15px;letter-spacing:.05em}
  .wrap{max-width:400px;margin:40px auto;background:#fff;border-radius:10px;padding:28px 24px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .logo{width:56px;height:56px;background:#0b3d91;border-radius:12px;margin:0 auto 18px}
  h1{text-align:center;font-size:18px;color:#0b3d91;margin-bottom:24px}
  input{width:100%;padding:13px 12px;margin-bottom:10px;border:1px solid #d7dee8;border-radius:6px;font-size:14px}
  button{width:100%;padding:14px;background:#0b3d91;color:#fff;border:none;border-radius:6px;font-weight:700;font-size:15px;margin-top:6px}
  .links{display:flex;justify-content:center;gap:16px;margin-top:16px;font-size:12px;color:#5b6b82}
  .cert{text-align:center;margin-top:20px;padding-top:16px;border-top:1px solid #e7ecf2;font-size:12px;color:#5b6b82}
  footer{text-align:center;margin-top:30px;font-size:10px;color:#9aa6b5}
</style></head>
<body>
<header>KB국민은행</header>
<div class="wrap">
  <div class="logo"></div>
  <h1>로그인</h1>
  <input placeholder="아이디">
  <input type="password" placeholder="비밀번호">
  <button>로그인</button>
  <div class="links"><span>아이디 찾기</span><span>비밀번호 찾기</span><span>회원가입</span></div>
  <div class="cert">공동인증서 로그인 &nbsp;|&nbsp; 지문/얼굴 로그인</div>
</div>
<footer>© KB국민은행. All rights reserved.</footer>
</body></html>
